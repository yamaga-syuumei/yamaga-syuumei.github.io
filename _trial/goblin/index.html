<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>ゴブリン試作</title>
<style>
body{margin:0;background:#3a3f4a;display:flex;gap:48px;align-items:center;justify-content:center;height:100vh;font:14px sans-serif;color:#ddd}
figure{margin:0;text-align:center}
canvas{image-rendering:pixelated;background:#556070;display:block}
</style>
</head>
<body>
<figure><canvas id="idle" width="96" height="96"></canvas><figcaption>待機</figcaption></figure>
<figure><canvas id="walk" width="96" height="96"></canvas><figcaption>歩き</figcaption></figure>
<script>
const img = new Image();
img.src = 'goblin_sheet.png';
const anims = [
  { el: document.getElementById('idle'), frames: [0, 1], ms: 500 },
  { el: document.getElementById('walk'), frames: [2, 3, 4, 5], ms: 150 },
];
img.onload = () => {
  for (const a of anims) {
    const ctx = a.el.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    let i = 0;
    const tick = () => {
      ctx.clearRect(0, 0, 96, 96);
      ctx.drawImage(img, a.frames[i] * 96, 0, 96, 96, 0, 0, 96, 96);
      i = (i + 1) % a.frames.length;
    };
    tick();
    setInterval(tick, a.ms);
  }
};
</script>
</body>
</html>
