<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ワンストローク・コロニー（試作）</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="cl-frame">

  <header class="cl-bar">
    <div class="cl-money"><i>所持金</i><b id="money">0</b><u>G</u></div>

    <div class="cl-sent">
      <div class="cl-sentrow"><span>残りの刑期</span><b id="years">40.0年</b></div>
      <div class="cl-sentbar"><div class="cl-sentfill" id="sentFill"></div></div>
      <div class="cl-sentnote" id="tierName"></div>
    </div>

    <div class="cl-total"><i>累計売上</i><b id="total">0</b><u>G</u></div>

    <div class="cl-btns">
      <button class="cl-btn" id="btnRes">研究</button>
      <button class="cl-btn" id="btnCodex">図鑑</button>
      <button class="cl-btn cl-btn-i" id="btnSound" hidden>🔊</button>
      <button class="cl-btn cl-btn-q" id="btnReset">最初から</button>
    </div>
  </header>

  <div class="cl-board"><canvas id="cv"></canvas></div>

  <p class="cl-hint" id="hint"></p>

  <div class="cl-pal">
    <div class="cl-tabs" id="tabs"></div>
    <div class="cl-cards" id="cards"></div>
  </div>

</div>

<!-- 右クリックのメニュー。設備・ベルト・岩で中身が変わる -->
<div class="cl-menu" id="menu" hidden>
  <div class="cl-mhead"><b id="mName"></b><i id="mInfo"></i></div>
  <div class="cl-mitems" id="mItems"></div>
</div>

<!-- マウスを乗せたときの説明 -->
<div class="cl-tip" id="tip" hidden></div>

<!-- 研究 -->
<div class="cl-ov" id="res" hidden>
  <div class="cl-panel cl-panel-w">
    <div class="cl-ovhead">研究</div>
    <div class="cl-cols" id="resBody"></div>
    <div class="cl-ovbtns"><button class="cl-btn cl-btn-p" id="btnResClose">閉じる</button></div>
  </div>
</div>

<!-- 図鑑 -->
<div class="cl-ov" id="codex" hidden>
  <div class="cl-panel cl-panel-w">
    <div class="cl-ovhead">図鑑</div>
    <div class="cl-codex" id="codexBody"></div>
    <div class="cl-ovbtns"><button class="cl-btn cl-btn-p" id="btnCodexClose">閉じる</button></div>
  </div>
</div>

<!-- 減刑通知 -->
<div class="cl-news" id="news" hidden>
  <div class="cl-newshead" id="newsHead"></div>
  <div class="cl-newsbody" id="newsBody"></div>
  <div class="cl-ovbtns">
    <button class="cl-btn" id="btnNewsClose">閉じる</button>
    <button class="cl-btn cl-btn-p" id="btnNewsEnd" hidden>釈放証明書</button>
  </div>
</div>

<!-- 釈放証明書 -->
<div class="cl-ov" id="cert" hidden>
  <div class="cl-panel cl-cert">
    <div class="cl-ovhead">釈放証明書</div>
    <div id="certBody"></div>
    <div class="cl-ovbtns"><button class="cl-btn cl-btn-p" id="btnCertClose">閉じる</button></div>
  </div>
</div>

<!-- 音 -->
<div class="cl-ov" id="ovSound" hidden>
  <div class="cl-panel">
    <div class="cl-ovhead">音</div>
    <div class="cl-vols">
      <label class="cl-vol"><span>BGM</span>
        <input type="range" id="vBgm" min="0" max="1" step="0.05"><b id="vBgmV"></b></label>
      <label class="cl-vol"><span>効果音</span>
        <input type="range" id="vSe" min="0" max="1" step="0.05"><b id="vSeV"></b></label>
    </div>
    <p class="cl-credits" id="credits" hidden></p>
    <div class="cl-ovbtns">
      <button class="cl-btn" id="btnMute">ミュート</button>
      <button class="cl-btn cl-btn-p" id="btnSoundClose">閉じる</button>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="sound.js"></script>
<script src="art.js"></script>
<script src="game.js"></script>
</body>
</html>
