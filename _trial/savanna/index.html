<!DOCTYPE html>
<html lang="ja">
<head>

<title>サバンナの一日</title>
<style>

canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#dbg{position:fixed;left:8px;top:8px;font:12px/1.5 monospace;color:#8f8;background:rgba(0,0,0,.65);padding:6px 9px;white-space:pre;display:none;pointer-events:none}
</style>
</head>
<body>
<canvas id="c" width="320" height="180"></canvas>
<div id="dbg"></div>
<script>
'use strict';
(() => {
const W = 320, H = 180, CYCLE = 90, START = 0.1, HOR = 106;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
ctx.imageSmoothingEnabled = false;
const img = ctx.createImageData(W, H);
const buf = new Uint32Array(img.data.buffer);

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const s = Math.min(innerWidth * dpr / W, innerHeight * dpr / H);
  const k = s >= 1 ? Math.floor(s) : s;
  cv.style.width = (W * k / dpr) + 'px';
  cv.style.height = (H * k / dpr) + 'px';
}
addEventListener('resize', resize);
resize();

// ---------- utilities ----------
const R = Math.round, PI = Math.PI;
const rnd = (a, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);
const bay = (x, y) => BAY[((y & 3) << 2) | (x & 3)];
const pack = (r, g, b) => 0xff000000 | (clamp(b | 0, 0, 255) << 16) | (clamp(g | 0, 0, 255) << 8) | clamp(r | 0, 0, 255);

function P(x, y, c) { if (x < 0 || y < 0 || x >= W || y >= H) return; buf[y * W + x] = c; }
function PA(x, y, c, a) { if (a >= 1 || a > bay(x, y)) P(x, y, c); }
function ADD(x, y, r, g, b) {
  if (x < 0 || y < 0 || x >= W || y >= H) return;
  const i = y * W + x, c = buf[i];
  buf[i] = 0xff000000 | (Math.min(255, ((c >> 16) & 255) + b) << 16) | (Math.min(255, ((c >> 8) & 255) + g) << 8) | Math.min(255, (c & 255) + r);
}
function MUL(x, y, f) {
  if (x < 0 || y < 0 || x >= W || y >= H) return;
  const i = y * W + x, c = buf[i];
  buf[i] = 0xff000000 | ((((c >> 16) & 255) * f) << 16) | ((((c >> 8) & 255) * f) << 8) | ((c & 255) * f);
}

function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const srnd = mulberry(20260927);
function hash(x, y) { let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(hash(xi, yi), hash(xi + 1, yi), u), lerp(hash(xi, yi + 1), hash(xi + 1, yi + 1), u), v);
}

// ---------- palette (32) ----------
const PAL = [
  [196,226,244],[110,170,230],[60,110,190],[248,244,236],
  [236,208,120],[196,160,80],[142,116,56],
  [212,160,110],[168,104,64],[110,66,44],
  [120,160,70],[66,104,50],[84,58,40],
  [120,180,200],[56,110,140],[110,100,150],
  [206,142,74],[120,70,36],[240,236,226],[26,22,26],
  [120,116,118],[70,66,72],[150,140,140],[96,88,92],
  [236,176,70],[140,80,40],[246,140,50],[200,60,50],[240,150,170],[250,240,120],[255,255,255],[210,140,80]
];
const SKY0=0,SKY1=1,SKY2=2,CLOUD=3,GRS0=4,GRS1=5,GRS2=6,DIRT0=7,DIRT1=8,DIRT2=9,LEAF0=10,LEAF1=11,BARK=12,WAT0=13,WAT1=14,MTN=15,
  LION0=16,LION1=17,ZEB=18,INK=19,GRAY0=20,GRAY1=21,ELE0=22,ELE1=23,GIR0=24,GIR1=25,ORNG=26,RED=27,PINK=28,GLOW=29,WHT=30,TAN=31;
const LIGHT = [...Array(32).keys()];
LIGHT[GRS2]=GRS1; LIGHT[GRS1]=GRS0; LIGHT[GRS0]=GLOW; LIGHT[DIRT1]=DIRT0; LIGHT[DIRT2]=DIRT1;

// ---------- time of day ----------
const KEYS = [
  [0.00,[0.78,0.6,0.62]],[0.07,[1.0,0.9,0.82]],[0.14,[1.05,1.03,0.98]],[0.40,[1.08,1.02,0.92]],
  [0.48,[1.2,0.78,0.5]],[0.54,[0.7,0.42,0.45]],[0.61,[0.22,0.26,0.44]],[0.90,[0.22,0.26,0.44]],
  [0.96,[0.46,0.4,0.56]],[1.00,[0.78,0.6,0.62]]
];
const SKYK = [
  [0.00,[70,72,130],[250,160,120]],[0.07,[96,150,215],[236,214,186]],[0.14,[72,140,222],[196,222,238]],
  [0.40,[72,136,218],[214,224,226]],[0.48,[80,70,150],[255,150,70]],[0.53,[46,34,96],[214,76,64]],
  [0.58,[20,20,56],[90,50,80]],[0.63,[6,10,28],[24,32,64]],[0.90,[6,10,28],[24,32,64]],
  [0.96,[30,32,78],[130,86,112]],[1.00,[70,72,130],[250,160,120]]
];
function keyAt(K, p) {
  for (let i = 0; i < K.length - 1; i++) {
    if (p >= K[i][0] && p <= K[i + 1][0]) {
      let t = (p - K[i][0]) / (K[i + 1][0] - K[i][0]); t = t * t * (3 - 2 * t);
      return K[i].slice(1).map((arr, j) => arr.map((v, k) => lerp(v, K[i + 1][j + 1][k], t)));
    }
  }
  return K[0].slice(1);
}
// layers: 0 mountain, 1 horizon, 2 mid, 3 foreground, 4 unfogged, 5 mid-far
const FOG = [0.62, 0.36, 0, 0, 0, 0.22], DARK = [1, 1, 1, 0.62, 1, 1];
const LUT = [0, 1, 2, 3, 4, 5].map(() => new Uint32Array(32));
const EM = new Uint32Array(32);
for (let i = 0; i < 32; i++) EM[i] = pack(PAL[i][0], PAL[i][1], PAL[i][2]);
const SKYB = new Uint32Array(8);
let T = 0, phase = START, D = 1, N = 0, WARM = 0, AMB = [1, 1, 1], SKY_TOP = [0, 0, 0], SKY_HOR = [0, 0, 0], HAZE = 0, wind = 0;
let sunX = 0, sunY = 0, sunUp = false;

function computeLight() {
  phase = (T / CYCLE + START) % 1;
  AMB = keyAt(KEYS, phase)[0];
  const lum = (AMB[0] + AMB[1] + AMB[2]) / 3;
  D = clamp((lum - 0.3) / 0.65, 0, 1); N = 1 - D;
  const dusk = Math.max(0, 1 - Math.abs(phase - 0.5) / 0.08);
  const dawn = Math.max(0, 1 - Math.min(phase, 1 - phase) / 0.07);
  WARM = Math.max(dusk, dawn * 0.8);
  const sk = keyAt(SKYK, phase);
  SKY_TOP = sk[0]; SKY_HOR = sk[1];
  for (let b = 0; b < 8; b++) {
    const t = b / 7;
    SKYB[b] = pack(lerp(SKY_TOP[0], SKY_HOR[0], t), lerp(SKY_TOP[1], SKY_HOR[1], t), lerp(SKY_TOP[2], SKY_HOR[2], t));
  }
  const fog = SKY_HOR.map(v => v * 0.9);
  for (let l = 0; l < 6; l++) {
    const f = FOG[l], d = DARK[l], L = LUT[l];
    for (let i = 0; i < 32; i++) {
      const p = PAL[i];
      L[i] = pack(lerp(p[0] * AMB[0] * d, fog[0], f), lerp(p[1] * AMB[1] * d, fog[1], f), lerp(p[2] * AMB[2] * d, fog[2], f));
    }
  }
  sunUp = phase < 0.53;
  const st = phase / 0.53;
  sunX = -6 + st * (W + 12);
  sunY = HOR + 2 - Math.sin(st * PI) * 88;
  HAZE = sunUp ? clamp(Math.sin(st * PI) - 0.75, 0, 1) * 4 : 0;
}

// ---------- terrain ----------
const WX = 222, WY = 140, WRX = 44, WRY = 9;
const inWater = (x, y, m) => { const dx = (x - WX) / (WRX * (m || 1)), dy = (y - WY) / (WRY * (m || 1)); return dx * dx + dy * dy < 1; };
const TREE = { x: 63, base: 132 };
const BURROWS = [{ x: 154, y: 154 }, { x: 162, y: 155 }, { x: 171, y: 154 }];
const midMap = new Uint8Array(W * H).fill(255), kind = new Uint8Array(W * H);
const far1 = new Uint8Array(W * H).fill(255), far2 = new Uint8Array(W * H).fill(255);
function plot(map, x, y, c, k) {
  if (x < 0 || y < 0 || x >= W || y >= H) return;
  map[y * W + x] = c;
  if (map === midMap) kind[y * W + x] = k || 2;
}
function tline(map, x0, y0, x1, y1, c, w) {
  const n = Math.max(1, Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0))));
  for (let i = 0; i <= n; i++) {
    const x = R(lerp(x0, x1, i / n)), y = R(lerp(y0, y1, i / n));
    for (let k = 0; k < w; k++) plot(map, x + k, y, c);
  }
}
function acacia(map, bx, by, top, bot, half, trunkTop, branches) {
  for (let y = by; y >= trunkTop; y--) {
    const x = R(bx + (by - y) * 0.06);
    plot(map, x, y, BARK); plot(map, x + 1, y, BARK); if (y > by - 8) plot(map, x - 1, y, BARK);
  }
  const tx = R(bx + (by - trunkTop) * 0.06);
  for (const [ex, ey] of branches) { tline(map, tx, trunkTop, ex, ey, BARK, 2); }
  for (let x = bx - half; x <= bx + half; x++) {
    const u = (x - bx) / half;
    const t0 = R(top + u * u * 5 + (vnoise(x * 0.2, 3) - 0.5) * 3);
    const t1 = R(bot - u * u * 3 + (vnoise(x * 0.17, 8) - 0.5) * 2);
    for (let y = t0; y <= t1; y++) {
      if (vnoise(x * 0.25, y * 0.5) > 0.8 && y > t0 + 1) continue;
      const c = y < t0 + 2 ? LEAF0 : y >= t1 ? LEAF1 : (vnoise(x * 0.3, y * 0.4) < 0.4 ? LEAF0 : LEAF1);
      plot(map, x, y, c);
    }
  }
}

(function genTerrain() {
  for (let x = 0; x < W; x++) {
    const m = HOR - 2 - 44 * Math.exp(-(((x - 238) / 34) ** 2)) - 12 * Math.exp(-(((x - 196) / 26) ** 2))
      - 8 * Math.exp(-(((x - 70) / 60) ** 2)) - 3 * vnoise(x * 0.08, 1.7);
    const top = R(m);
    for (let y = top; y < HOR + 4; y++) {
      let c = MTN;
      if (top < 76 && y - top < (80 - top) * 0.35 + (vnoise(x * 0.3, y * 0.3) - 0.5) * 3) c = CLOUD;
      else if (vnoise(x * 0.15, y * 0.12) < 0.3) c = GRAY1;
      far2[y * W + x] = c;
    }
    const t1 = R(HOR - 2 - vnoise(x * 0.05, 4) * 2);
    for (let y = t1; y < HOR + 6; y++) far1[y * W + x] = y === t1 ? GRS2 : GRS1;
  }
  for (let i = 0; i < 16; i++) {
    const x = R(srnd() * W), y = HOR - 2, w = 2 + R(srnd() * 3);
    for (let k = 1; k <= 3; k++) plot(far1, x, y - k, BARK);
    for (let dx = -w; dx <= w; dx++) { plot(far1, x + dx, y - 4, LEAF1); if (Math.abs(dx) < w) plot(far1, x + dx, y - 5, LEAF1); }
  }
  for (let i = 0; i < 40; i++) { const x = R(srnd() * W), y = HOR - 2 + R(srnd() * 4); plot(far1, x, y, LEAF1); plot(far1, x + 1, y, LEAF1); }

  const pathY = x => 160 - 12 * Math.sin(x * 0.012 + 0.5);
  for (let y = HOR; y < H; y++) for (let x = 0; x < W; x++) {
    const d = (y - HOR) / (H - HOR);
    const n = vnoise(x * 0.06 / (0.3 + d), y * 0.25);
    let c = d < 0.15 ? (n < 0.45 ? GRS0 : GRS1) : (n < 0.35 ? GRS0 : n < 0.7 ? GRS1 : GRS2);
    const dn = vnoise(x * 0.03, y * 0.08 + 9);
    if (dn > 0.74) c = dn > 0.8 ? DIRT1 : DIRT0;
    if (d > 0.25 && hash(x, y) < 0.09 * d) c = GRS2;
    if (d > 0.25 && hash(x + 7, y) < 0.05 * d) c = GRS0;
    if (x < 176 && Math.abs(y - pathY(x)) < 1 + d * 2) c = hash(x, y + 3) < 0.25 ? DIRT1 : DIRT0;
    const sx = (x - TREE.x) / 44, sy = (y - TREE.base - 2) / 5;
    if (sx * sx + sy * sy < 1) c = c === GRS0 ? GRS1 : c === GRS1 ? GRS2 : c === DIRT0 ? DIRT1 : c;
    const ex = (x - WX) / WRX, ey = (y - WY) / WRY, e = ex * ex + ey * ey;
    if (e < 1) { plot(midMap, x, y, WAT1, 4); continue; }
    if (e < 1.45) c = e < 1.18 ? DIRT2 : DIRT1;
    plot(midMap, x, y, c, 1);
  }
  const solid = new Uint8Array(W * H);
  const blob = (cx, cy, rx, ry) => {
    for (let y = cy - ry - 2; y <= cy + ry + 2; y++) for (let x = cx - rx - 2; x <= cx + rx + 2; x++) {
      const dx = (x - cx) / rx, dy = (y - cy) / ry;
      if (dx * dx + dy * dy < 1 + (vnoise(x * 0.25, y * 0.25) - 0.5) * 0.5 && y < cy + ry * 0.5) solid[y * W + x] = 1;
    }
  };
  blob(112, 124, 10, 6); blob(126, 122, 8, 7); blob(138, 126, 6, 4);
  for (let y = 1; y < H; y++) for (let x = 1; x < W - 1; x++) {
    const i = y * W + x;
    if (!solid[i]) continue;
    const top = !solid[i - W];
    plot(midMap, x, y, top ? GRAY0 : (!solid[i + 1] || vnoise(x * 0.3, y * 0.3) < 0.35) ? GRAY1 : GRAY0, 3);
  }
  for (let y = 104; y <= 124; y++) {
    const w = 1 + (y - 104) * 0.28;
    for (let x = R(186 - w); x <= R(186 + w); x++) plot(midMap, x, y, x < 186 - w * 0.4 ? DIRT0 : x > 186 + w * 0.5 ? DIRT2 : DIRT1, 3);
  }
  for (let y = 151; y <= 158; y++) for (let x = 146; x <= 178; x++) {
    const dx = (x - 162) / 16, dy = (y - 156) / 4;
    if (dx * dx + dy * dy < 1) plot(midMap, x, y, y < 153 ? DIRT0 : hash(x, y) < 0.3 ? DIRT1 : DIRT0, 3);
  }
  for (const b of BURROWS) { plot(midMap, b.x, b.y, INK, 3); plot(midMap, b.x + 1, b.y, INK, 3); plot(midMap, b.x, b.y - 1, DIRT2, 3); plot(midMap, b.x + 1, b.y - 1, DIRT2, 3); }
  acacia(midMap, TREE.x, TREE.base, 80, 92, 44, 104, [[40, 93], [52, 91], [64, 90], [78, 91], [90, 93]]);
  acacia(midMap, 292, 120, 95, 101, 22, 106, [[280, 101], [292, 100], [304, 101]]);
})();
function buildList(map) {
  const I = [], C = [], X = [], Y = [], K = [];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x;
    if (map[i] === 255) continue;
    I.push(i); C.push(map[i]); X.push(x); Y.push(y); K.push(kind[i]);
  }
  return { I, C, X, Y, K };
}
const MID = buildList(midMap), F1 = buildList(far1), F2 = buildList(far2);
const avoidWater = o => {
  const dx = (o.x - WX) / (WRX + 3), dy = (o.y - WY) / (WRY + 2.5), e = dx * dx + dy * dy;
  if (e < 1) { const a = Math.atan2(dy, dx); o.x = WX + Math.cos(a) * (WRX + 3); o.y = WY + Math.sin(a) * (WRY + 2.5); }
};
const DRINK_SPOTS = [];
for (let a = -0.8; a <= 0.8; a += 0.2) {
  DRINK_SPOTS.push({ x: WX + Math.cos(a) * (WRX + 3), y: WY + Math.sin(a) * (WRY + 2.5), dir: -1 });
  DRINK_SPOTS.push({ x: WX - Math.cos(a) * (WRX + 3), y: WY + Math.sin(a) * (WRY + 2.5), dir: 1 });
}

// ---------- shared state ----------
const threats = [];
const parts = [];
function part(o) { if (parts.length < 700) parts.push(o); }
function dust(x, y, n, sp) {
  for (let i = 0; i < n; i++) part({ x: x + rnd(-2, 2), y: y - rnd(0, 1), vx: rnd(-sp, sp) * 0.5, vy: -rnd(2, sp), g: 4, dr: 1.8, l: rnd(0.8, 1.8), m: 1.8, c: Math.random() < 0.5 ? DIRT0 : GRS0, L: 2, gy: y + 1 });
}
function splash(x, y, n, sp) {
  for (let i = 0; i < n; i++) part({ x: x + rnd(-2, 2), y, vx: rnd(-sp, sp) * 0.4, vy: -rnd(sp * 0.4, sp), g: 60, dr: 0.5, l: rnd(0.4, 0.9), m: 0.9, c: Math.random() < 0.5 ? WHT : WAT0, L: 2, gy: y + 1 });
}
const ripples = [];
function ripple(x, y) { if (ripples.length < 30) ripples.push({ x, y, a: 0 }); }
const nearest = (list, x, y) => { let b = null, bd = 1e9; for (const o of list) { const d = Math.hypot(o.x - x, (o.y - y) * 1.5); if (d < bd) { bd = d; b = o; } } return [b, bd]; };

// ---------- quadruped drawing ----------
let QX = 0, QY = 0, QD = 1, QL = LUT[2];
function qp(lx, ly, c) { P(Math.floor(QX + lx * QD + 0.5), Math.floor(QY + ly + 0.5), QL[c]); }
function qadd(lx, ly, r, g, b) { ADD(Math.floor(QX + lx * QD + 0.5), Math.floor(QY + ly + 0.5), r, g, b); }
function qline(x0, y0, x1, y1, c, w) {
  const n = Math.max(1, Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0))));
  for (let i = 0; i <= n; i++) {
    const t = i / n, x = x0 + (x1 - x0) * t, y = y0 + (y1 - y0) * t, cc = typeof c === 'function' ? c(i, n) : c;
    qp(x, y, cc);
    if (w > 1) qp(x + 1, y, cc);
    if (w > 2) qp(x - 1, y, cc);
    if (w > 3) qp(x + 2, y, cc);
  }
}
function qell(cx, cy, rx, ry, fn) {
  const x0 = Math.floor(-rx), x1 = Math.ceil(rx), y0 = Math.floor(-ry), y1 = Math.ceil(ry);
  for (let dy = y0; dy <= y1; dy++) for (let dx = x0; dx <= x1; dx++) {
    const e = (dx / rx) ** 2 + (dy / ry) ** 2;
    if (e < 1) { const c = fn(dx, dy, e); if (c >= 0) qp(cx + dx, cy + dy, c); }
  }
}
function qrell(cx, cy, rx, ry, ang, fn) {
  const ca = Math.cos(ang), sa = Math.sin(ang), r = Math.ceil(Math.max(rx, ry)) + 1;
  for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
    const u = dx * ca + dy * sa, v = -dx * sa + dy * ca, e = (u / rx) ** 2 + (v / ry) ** 2;
    if (e < 1) { const c = fn(u, v, e); if (c >= 0) qp(cx + dx, cy + dy, c); }
  }
}
function layerFor(y) { return y < 124 ? LUT[5] : LUT[2]; }
function shadow(x, y, rx) {
  if (D < 0.15) return;
  const f = 1 - 0.28 * D;
  for (let dx = -rx; dx <= rx; dx++) { MUL(R(x + dx), R(y), f); if (Math.abs(dx) < rx - 1) MUL(R(x + dx), R(y) + 1, f); }
}
function headGeneric(hx, hy, hd, hl, hh, cHead, cMuz, eye) {
  const cx = hx + Math.cos(hd) * hl * 0.5, cy = hy + Math.sin(hd) * hl * 0.5;
  qrell(cx, cy, hl * 0.55, hh, hd, u => u > hl * 0.22 ? cMuz : cHead);
  if (eye >= 0) qp(hx + Math.cos(hd) * hl * 0.25 + Math.sin(hd) * 0.8, hy + Math.sin(hd) * hl * 0.25 - Math.cos(hd) * 0.8, eye);
}
const SPEC = {
  wild: { bl: 5.5, bh: 2.6, hump: 1.2, leg: 5, neck: 3.5, nw: 2, nUp: -0.55, nDn: 1.25, hl: 4, tail: 4, tailC: INK, legN: GRAY1, legF: INK, slope: 0.1,
    body: (dx, dy, hh) => dy < -hh * 0.55 ? GRAY1 : ((dx + 40) % 3 === 0 && dy < hh * 0.4 ? GRAY1 : GRAY0), neckC: GRAY1,

  for (const g of giraffes) drawList.push([g.y, drawQuad, g, SPEC.giraffe]);
  for (const m of meerkats) drawList.push([m.y, drawMeerkat, m]);
  drawList.push([beetle.y, drawBeetle, beetle]);
  drawList.push([devil.y + 1, drawDevil, devil]);
  drawList.sort((a, b) => a[0] - b[0]);
  for (const d of drawList) d[1](d[2], d[3]);
  const Lp = LUT[2];
  for (const p of parts) PA(R(p.x), R(p.y), (p.L === 2 ? Lp : LUT[p.L])[p.c], p.l / p.m);
  for (const f of flocks) f.draw();
  drawEagle(); drawBats();
  drawNearGrass();
  drawFireflies();
  ctx.putImageData(img, 0, 0);
}

// ---------- loop & debug ----------
const dbg = document.getElementById('dbg');
let showDbg = false, fpsN = 0, fpsT = 0, fps = 0, last = performance.now();
addEventListener('keydown', e => { if (e.key === 'd' || e.key === 'D') { showDbg = !showDbg; dbg.style.display = showDbg ? 'block' : 'none'; } });
function debugText() {
  const clock = ['朝', '昼', '昼', '昼', '夕', '夜', '夜', '夜', '夜', '朝'][Math.min(9, (phase * 10) | 0)];
  return `FPS ${fps}\n時刻 ${clock} (${(phase * 100).toFixed(0)}%)  明るさ ${D.toFixed(2)}\n` +
    herds.map(h => `${h.name} ${h.an.length} ${h.mode}`).join('  ') + '\n' +
    `ライオン ${pride.st}  ハイエナ ${hpack.st}  ゾウ ${fam.st}  キリン ${giraffes.map(g => g.st).join('/')}\n` +
    `ミーアキャット ${meerkats.map(m => m.st).join('/')}\n` +
    `ワニ ${croc.st}  カバ ${hippos.map(h => h.yawn > 0 ? 'yawn' : h.st).join('/')}  ワシ ${eagle.st}\n` +
    `粒子 ${parts.length}  波紋 ${ripples.length}`;
}
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05;
  if (dt > 0) update(dt);
  render();
  fpsN++; fpsT += dt;
  if (fpsT >= 0.5) { fps = Math.round(fpsN / fpsT); fpsN = 0; fpsT = 0; if (showDbg) dbg.textContent = debugText(); }
  requestAnimationFrame(frame);
}
for (let i = 0; i < 180; i++) update(1 / 60);
T = 0;
render();
requestAnimationFrame(frame);
})();
</script>
