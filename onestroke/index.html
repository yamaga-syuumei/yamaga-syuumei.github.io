<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ワンストローク・ファクトリー（ベータ 1.0） | ヒノガタリ</title>
<meta name="description" content="一筆書きでベルトコンベアを引き、供給口と工場と納品口をつなぐパズル。ベルトは交差できません。全30ステージのブラウザゲーム。">
<meta property="og:type" content="website">
<meta property="og:title" content="ワンストローク・ファクトリー（ベータ 1.0） | ヒノガタリ">
<meta property="og:url" content="https://yamaga-syuumei.github.io/onestroke/">
<meta property="og:description" content="一筆書きでベルトを引き、工場をつなぐ。ベルトは交差できないので、通す順番と道の取り方を考えます。全30ステージ、ブラウザだけで遊べます。">
<meta property="og:image" content="https://yamaga-syuumei.github.io/img/onestroke.png">
<meta property="og:image:width" content="539">
<meta property="og:image:height" content="524">
<meta name="twitter:image" content="https://yamaga-syuumei.github.io/img/onestroke.png">
<link rel="canonical" href="https://yamaga-syuumei.github.io/onestroke/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@SyuumeiYamaga">

<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="style.css?v=76613711">
</head>
<body>

<div class="of-frame">

  <header class="of-bar">
    <button class="of-btn" id="btnStages">ステージ</button>
    <div class="of-title"><span id="stgNo">1</span><b id="stgName"></b></div>
    <div class="of-nums">
    <div class="of-goals" id="goals"></div>
    <div class="of-stats">
      <span class="of-stat"><u>★</u><i>マス</i><b id="statCells">0</b><em id="parCells"></em></span>
      <span class="of-stat"><u>★</u><i>時間</i><b id="statTime">0.0</b><em id="parTime"></em></span>
    </div>
    </div>
    <button class="of-btn of-btn-i" id="btnMute" hidden>🔊</button>
    <button class="of-btn" id="btnReset">やり直す</button>
  </header>

  <div class="of-board">
    <canvas id="cv"></canvas>
  </div>

  <p class="of-hint" id="hint"></p>

  <!-- タイトル。裏でデモが勝手に遊んでいる -->
  <div class="of-ov of-ov-title" id="ovTitle" hidden>
    <div class="of-titlecard">
      <h1>ワンストローク・ファクトリー</h1>
      <p class="of-tagline">一筆書きでベルトを引き、工場をつなぐ</p>
      <div class="of-ov-btns">
        <button class="of-btn of-btn-p" id="btnStart">はじめる</button>
        <button class="of-btn" id="btnTitleStages">ステージ選択</button>
      </div>
      <p class="of-titlenote" id="titleNote"></p>
      <a class="of-home" href="../">← ヒノガタリ</a>
    </div>
  </div>

  <!-- クリア -->
  <div class="of-ov" id="ovClear" hidden>
    <div class="of-panel">
      <div class="of-ov-stage" id="clearStage"></div>
      <div class="of-ov-head">納品完了</div>
      <div class="of-stars" id="clearStars"></div>
      <ul class="of-score" id="clearScore"></ul>
      <div class="of-ov-btns">
        <button class="of-btn" id="btnRetry">もう一度</button>
        <button class="of-btn of-btn-p" id="btnNext">次のステージ</button>
      </div>
    </div>
  </div>

  <!-- ステージ選択 -->
  <div class="of-ov" id="ovStages" hidden>
    <div class="of-panel of-panel-w">
      <div class="of-ov-head">ステージ</div>
      <div class="of-sel" id="stageList"></div>
      <p class="of-credits" id="credits" hidden></p>
      <div class="of-ov-btns">
        <button class="of-btn" id="btnTitle">タイトルへ</button>
        <button class="of-btn" id="btnCloseStages">閉じる</button>
      </div>
    </div>
  </div>

</div>

<script src="sound.js?v=ce0f74b3"></script>
<script src="stages.js?v=faaaf8f5"></script>
<script src="art.js?v=d737bca1"></script>
<script src="game.js?v=ff1c818e"></script>

</body>
</html>
