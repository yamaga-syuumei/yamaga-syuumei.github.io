name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 開発用のもの（dev ブロック・_ 始まり・. 始まり）を公開物から落とす
      - run: python3 .github/strip-dev.py .

      # 公開物に開発用の入口が残っていないことを確かめる。残っていたら公開しない
      - name: 取り残しの確認
        run: |
          if grep -rn "window\.__osf\|window\.__garage\|window\.__tank\|window\.CF *=" \
               --include=*.js --include=*.html . ; then
            echo "開発用の入口が残っています"
            exit 1
          fi
          echo "OK"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
