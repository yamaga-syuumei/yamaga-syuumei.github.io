<style>

body{cursor:none}
body.ui-on{cursor:default}

  /* 形・動き・文字サイズ。サイト側と同じ基準に合わせている。
     値の一覧と、参照作品の実測値は website/_styleguide/index.html を見ること。

  --r-1:4px;        /* ボタン、小さい面 */
  --r-2:14px;       /* 盤面、パネル */
  --r-pill:999px;   /* 完全な丸端 */

  --t:.16s ease-out;

  --fs-1:10px;
  --fs-2:12px;
  --fs-3:14px;
  --fs-4:15px;
  --fs-5:18px;
  --fs-6:24px;
  --fs-7:30px;
:root{--fg:#e6edf5;--dim:#8a97a8;--line:#2a3a4e;--accent:#7fd4ff}
.ui-btn{background:#101823;color:var(--fg);border:1px solid var(--line);border-radius:var(--r-1);padding:6px 12px;font:13px/1.4 system-ui,sans-serif;cursor:pointer;text-decoration:none;white-space:nowrap}

<body>
<canvas id="c" width="320" height="180"></canvas>
<div id="dbg"></div>
<button class="ui-btn ui-gear" id="gear" title="オプション" aria-label="オプション"></button>
<div class="ui-ov" id="opt" hidden>
  <div class="ui-panel">
    <h2>サンゴ礁の一日</h2>
    <p class="ui-tag">浅い海のサンゴ礁の朝から夜までを、90秒でくり返します。サメが近づけば群れは散り、夜にはクラゲが光ります。眺めるだけの作品です。</p>
    <div class="ui-link">
      <div>
        <b>ヒノガタリ</b>
        <span>ほかのブラウザゲームと小説の置き場所です。</span>
      </div>
      <a class="ui-btn" href="../">開発者サイトへ</a>
    </div>
    <div class="ui-btns"><button class="ui-btn ui-btn-p" id="optClose">閉じる</button></div>
  </div>
</div>
<script>
'use strict';
(() => {
const W = 320, H = 180, CYCLE = 90, START = 0.1, SURF = 12;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
ctx.imageSmoothingEnabled = false;
const img = ctx.createImageData(W, H);
const buf = new Uint32Array(img.data.buffer);

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const s = Math.min(innerWidth * dpr / W, innerHeight * dpr / H);
  const k = Math.floor(s) >= 1 && Math.floor(s) >= s * 0.85 ? Math.floor(s) : s;
  cv.style.width = (W * k / dpr) + 'px';
  cv.style.height = (H * k / dpr) + 'px';
}
addEventListener('resize', resize);
resize();

// ---------- utilities ----------
const R = Math.round, PI = Math.PI;
const rnd = (a, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);
const bay = (x, y) => BAY[((y & 3) << 2) | (x & 3)];
const pack = (r, g, b) => 0xff000000 | (clamp(b | 0, 0, 255) << 16) | (clamp(g | 0, 0, 255) << 8) | clamp(r | 0, 0, 255);

function P(x, y, c) { if (x < 0 || y < 0 || x >= W || y >= H) return; buf[y * W + x] = c; }
function PA(x, y, c, a) { if (a >= 1 || a > bay(x, y)) P(x, y, c); }
function ADD(x, y, r, g, b) {
  if (x < 0 || y < 0 || x >= W || y >= H) return;
  const i = y * W + x, c = buf[i];
  const rr = Math.min(255, (c & 255) + r), gg = Math.min(255, ((c >> 8) & 255) + g), bb = Math.min(255, ((c >> 16) & 255) + b);
  buf[i] = 0xff000000 | (bb << 16) | (gg << 8) | rr;
}

function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const srnd = mulberry(20260925);
function hash(x, y) { let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(hash(xi, yi), hash(xi + 1, yi), u), lerp(hash(xi, yi + 1), hash(xi + 1, yi + 1), u), v);
}

// ---------- palette (32) ----------
const PAL = [
  [176,228,240],[96,176,224],[72,176,200],[36,120,172],[22,72,130],[12,36,80],
  [240,220,160],[206,172,112],[150,112,76],
  [132,128,140],[90,86,104],[52,48,66],
  [248,120,152],[192,48,88],[248,152,64],[150,80,190],
  [100,200,90],[40,120,72],
  [252,220,60],[240,100,30],[248,248,240],[16,20,36],[40,110,230],[180,196,210],
  [140,156,172],[84,98,120],[110,150,80],[130,90,50],[220,160,230],[120,255,230],[220,60,50],[80,230,220]
];
const SKY0=0,SKY1=1,SAND0=6,SAND1=7,SAND2=8,ROCK0=9,ROCK1=10,ROCK2=11,PINK=12,CRIM=13,ORNG=14,PURP=15,GRN0=16,GRN1=17,
  YEL=18,CLWN=19,WHT=20,INK=21,BLUE=22,SILV=23,SHK0=24,SHK1=25,TSKN=26,TSHL=27,JELY=28,GLOW=29,RED=30,AQUA=31;
const LIGHT = [...Array(32).keys()];
LIGHT[SAND2]=SAND1; LIGHT[SAND1]=SAND0; LIGHT[SAND0]=WHT; LIGHT[ROCK2]=ROCK1; LIGHT[ROCK1]=ROCK0; LIGHT[ROCK0]=SILV;
LIGHT[GRN1]=GRN0; LIGHT[CRIM]=PINK; LIGHT[PINK]=JELY; LIGHT[ORNG]=YEL; LIGHT[PURP]=JELY; LIGHT[AQUA]=SKY0; LIGHT[TSHL]=TSKN;

// ---------- time of day ----------
const KEYS = [
  [0.00,[0.82,0.64,0.72]],[0.07,[1.0,0.93,0.9]],[0.14,[1.06,1.06,1.06]],[0.40,[1.06,1.04,1.0]],
  [0.49,[1.18,0.74,0.46]],[0.555,[0.62,0.40,0.48]],[0.62,[0.22,0.28,0.48]],[0.90,[0.22,0.28,0.48]],
  [0.96,[0.48,0.42,0.6]],[1.00,[0.82,0.64,0.72]]
];
// layers: 0 far ridge, 1 far, 2 mid, 3 near(foreground), 4 unfogged
const FOG = [0.8, 0.5, 0.07, 0, 0], DARK = [1, 1, 1, 0.66, 1];
const LUT = [0, 1, 2, 3, 4].map(() => new Uint32Array(32));
const EM = new Uint32Array(32);
for (let i = 0; i < 32; i++) EM[i] = pack(PAL[i][0], PAL[i][1], PAL[i][2]);
let T = 0, phase = START, D = 1, N = 0, WARM = 0, AMB = [1, 1, 1], SKYT = 0, SKYB = 0, SURFC = 0, cur = 0;

function computeLight() {
  phase = (T / CYCLE + START) % 1;
  let a = KEYS[0], b = KEYS[1];
  for (let i = 0; i < KEYS.length - 1; i++) if (phase >= KEYS[i][0] && phase <= KEYS[i + 1][0]) { a = KEYS[i]; b = KEYS[i + 1]; break; }
  let t = (phase - a[0]) / (b[0] - a[0]); t = t * t * (3 - 2 * t);
  AMB = [0, 1, 2].map(k => lerp(a[1][k], b[1][k], t));
  const lum = (AMB[0] + AMB[1] + AMB[2]) / 3;
  D = clamp((lum - 0.3) / 0.65, 0, 1); N = 1 - D;
  const dusk = Math.max(0, 1 - Math.abs(phase - 0.5) / 0.08);
  const dawn = Math.max(0, 1 - Math.min(phase, 1 - phase) / 0.07);
  WARM = Math.max(dusk, dawn * 0.7);
  const fog = [0, 1, 2].map(k => lerp(PAL[3][k], PAL[4][k], 0.4) * AMB[k]);
  for (let l = 0; l < 5; l++) {
    const f = FOG[l], d = DARK[l], L = LUT[l];
    for (let i = 0; i < 32; i++) {
      const p = PAL[i];
      L[i] = pack(lerp(p[0] * AMB[0] * d, fog[0], f), lerp(p[1] * AMB[1] * d, fog[1], f), lerp(p[2] * AMB[2] * d, fog[2], f));
    }
  }
  const top = [lerp(96, 120, WARM), lerp(176, 80, WARM), lerp(224, 150, WARM)];
  const bot = [lerp(176, 255, WARM), lerp(228, 150, WARM), lerp(240, 90, WARM)];
  SKYT = pack(top[0] * AMB[0], top[1] * AMB[1], top[2] * AMB[2]);
  SKYB = pack(bot[0] * AMB[0], bot[1] * AMB[1], bot[2] * AMB[2]);
  SURFC = pack(lerp(200, 255, WARM) * AMB[0] + 20 * N, lerp(240, 190, WARM) * AMB[1] + 30 * N, lerp(250, 150, WARM) * AMB[2] + 50 * N);
}

// ---------- terrain ----------
const midMap = new Uint8Array(W * H).fill(255), kind = new Uint8Array(W * H);
const far1 = new Uint8Array(W * H).fill(255), far2 = new Uint8Array(W * H).fill(255), nearMap = new Uint8Array(W * H).fill(255);
const sandTop = new Int16Array(W), groundTop = new Int16Array(W), solidTop = new Int16Array(W);
function plot(map, x, y, c, k) {
  if (x < 0 || y < 0 || x >= W || y >= H) return;
  map[y * W + x] = c;
  if (map === midMap) kind[y * W + x] = k || 3;
}
function branch(map, x, y, ang, len, d, c, tip) {
  for (let s = 0; s < len; s++) {
    x += Math.cos(ang); y += Math.sin(ang);
    ang = clamp(ang + (srnd() - 0.5) * 0.35, -PI + 0.35, -0.35);
    plot(map, R(x), R(y), c);
    if (d === 0) plot(map, R(x) + 1, R(y), c);
  }
  plot(map, R(x), R(y), tip);
  if (d < 3) {
    const nb = srnd() < 0.7 ? 2 : 1;
    for (let k = 0; k < nb; k++) branch(map, x, y, ang + (k ? 0.55 : -0.55) + (srnd() - 0.5) * 0.4, len * (0.6 + srnd() * 0.2), d + 1, c, tip);
  }
}
function brain(map, cx, by, rx, ry, c1, c2) {
  for (let y = by - ry; y <= by; y++) for (let x = cx - rx; x <= cx + rx; x++) {
    const dx = (x - cx) / rx, dy = (y - by) / ry;
    if (dx * dx + dy * dy < 1) plot(map, x, y, Math.sin(x * 1.1 + Math.sin(y * 0.9) * 2.2) > 0.2 ? c1 : c2);
  }
}
function fan(map, cx, by, h, c, c2) {
  for (let a = -1.1; a <= 1.1; a += 0.16) {
    const len = h * (0.8 + 0.2 * Math.cos(a));
    for (let s = 1; s < len; s++) plot(map, R(cx + Math.sin(a) * s * 0.9), R(by - Math.cos(a) * s), s > len - 2 ? c2 : c);
  }
  for (let r = 4; r < h; r += 3) for (let a = -1; a <= 1; a += 0.08) plot(map, R(cx + Math.sin(a) * r * 0.9), R(by - Math.cos(a) * r), c);
}
function tubes(map, cx, by, c, c2) {
  [[-3, 7], [0, 11], [3, 6], [5, 9]].forEach(([dx, h]) => {
    for (let y = by - h; y <= by; y++) for (let x = cx + dx; x < cx + dx + 2; x++) plot(map, x, y, y === by - h ? INK : (y === by - h + 1 ? c2 : c));
  });
}
function table(map, cx, by) {
  for (let y = by - 5; y <= by; y++) { plot(map, cx, y, GRN1); plot(map, cx + 1, y, GRN1); }
  for (let x = cx - 9; x <= cx + 10; x++) { plot(map, x, by - 6, AQUA); plot(map, x, by - 5, GRN1); }
  plot(map, cx - 10, by - 7, AQUA); plot(map, cx + 11, by - 7, AQUA);
}

(function genTerrain() {
  for (let x = 0; x < W; x++) {
    const t2 = R(104 - 12 * vnoise(x * 0.022, 3.3) - 5 * vnoise(x * 0.09, 7.1));
    for (let y = t2; y < H; y++) far2[y * W + x] = y === t2 ? ROCK0 : ROCK1;
    const t1 = R(126 - 11 * vnoise(x * 0.03, 11.7) - 4 * vnoise(x * 0.13, 2.2));
    for (let y = t1; y < H; y++) far1[y * W + x] = y - t1 < 2 ? ROCK0 : (vnoise(x * 0.2, y * 0.2) < 0.3 ? ROCK2 : ROCK1);
  }
  const firstY = (map, x) => { for (let y = 0; y < H; y++) if (map[y * W + x] !== 255) return y; return H; };
  for (let i = 0; i < 10; i++) { const x = R(srnd() * W); branch(far2, x, firstY(far2, x), -PI / 2, 4 + srnd() * 4, 1, ROCK0, ROCK0); }
  const fc = [PINK, PURP, ORNG, ROCK0, YEL];
  for (let i = 0; i < 16; i++) {
    const x = R(srnd() * W), c = fc[i % fc.length];
    if (i % 3 === 2) fan(far1, x, firstY(far1, x), 6 + srnd() * 4, c, c);
    else branch(far1, x, firstY(far1, x), -PI / 2, 3 + srnd() * 3, 1, c, c);
  }

  for (let x = 0; x < W; x++) {
    sandTop[x] = R(151 + 2.5 * Math.sin(x * 0.031 + 1) + 1.5 * Math.sin(x * 0.083 + 0.4));
    for (let y = sandTop[x]; y < H; y++) {
      const d = y - sandTop[x];
      const s = d / 16 + (vnoise(x * 0.15, y * 0.4) - 0.5) * 0.6;
      let c = s < 0.15 ? SAND0 : s < 0.62 ? SAND1 : SAND2;
      if (d > 1 && ((x + y * 3 + R(Math.sin(y * 0.7) * 2)) % 9 === 0)) c = c === SAND0 ? SAND1 : SAND2;
      const h = hash(x, y);
      if (h < 0.01) c = WHT; else if (h < 0.02) c = ROCK0;
      plot(midMap, x, y, c, 1);
    }
  }

  const solid = new Uint8Array(W * H);
  const blob = (cx, cy, rx, ry) => {
    for (let y = Math.max(0, cy - ry - 4); y < Math.min(H, cy + ry + 4); y++)
      for (let x = Math.max(0, cx - rx - 4); x < Math.min(W, cx + rx + 4); x++) {
        const dx = (x - cx) / rx, dy = (y - cy) / ry;
        if (dx * dx + dy * dy < 1 + (vnoise(x * 0.18, y * 0.18) - 0.5) * 0.5) solid[y * W + x] = 1;
      }
  };
  blob(18, 146, 30, 36); blob(46, 150, 24, 18); blob(6, 118, 14, 24); blob(32, 124, 14, 12);
  blob(140, 155, 13, 7); blob(176, 157, 7, 4);
  blob(266, 146, 32, 20); blob(294, 136, 22, 24); blob(244, 154, 16, 8);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x;
    if (!solid[i]) continue;
    const top = y === 0 || !solid[i - W], top2 = y < 2 || !solid[i - 2 * W];
    const n = vnoise(x * 0.3, y * 0.3);
    let c = top ? ROCK0 : top2 ? (n > 0.4 ? ROCK0 : ROCK1) : (n < 0.3 ? ROCK2 : ROCK1);
    if (!top && hash(x, y) < 0.05) c = ROCK2;
    if (top && vnoise(x * 0.2, y * 0.2) > 0.55) c = GRN1;
    if (x > 0 && !solid[i - 1] && !top) c = ROCK1;
    if (x < W - 1 && !solid[i + 1] && !top) c = ROCK2;
    plot(midMap, x, y, c, 2);
  }
  const hole = (cx, cy, rx, ry) => {
    for (let y = cy - ry; y <= cy + ry; y++) for (let x = cx - rx; x <= cx + rx; x++) {
      const dx = (x - cx) / rx, dy = (y - cy) / ry;
      if (dx * dx + dy * dy <= 1.05) plot(midMap, x, y, INK, 2);
    }
  };
  hole(58, 140, 2, 2); hole(298, 126, 3, 2);

  for (let x = 0; x < W; x++) { groundTop[x] = H - 1; for (let y = 0; y < H; y++) if (kind[y * W + x]) { groundTop[x] = y; break; } }
  staghornAt(14, PINK, WHT); tubes(midMap, 26, groundTop[27], PURP, JELY); brain(midMap, 44, groundTop[44], 6, 5, YEL, ORNG);
  fan(midMap, 4, groundTop[4], 12, PURP, JELY);
  brain(midMap, 100, groundTop[100], 7, 5, ORNG, CRIM); staghornAt(126, ORNG, YEL); fan(midMap, 150, groundTop[150], 10, CRIM, PINK);
  staghornAt(180, PINK, WHT); tubes(midMap, 238, groundTop[238], CRIM, PINK);
  table(midMap, 283, groundTop[283]); fan(midMap, 309, groundTop[309], 13, PURP, JELY); brain(midMap, 247, groundTop[247], 4, 3, AQUA, GRN1);
  staghornAt(276, YEL, WHT);
  function staghornAt(x, c, tip) { const y = groundTop[x]; for (let k = 0; k < 3; k++) branch(midMap, x + (k - 1) * 2, y, -PI / 2 + (k - 1) * 0.4, 5 + srnd() * 3, 0, c, tip); }

  for (let x = 0; x < W; x++) { solidTop[x] = H - 1; for (let y = 0; y < H; y++) if (midMap[y * W + x] !== 255) { solidTop[x] = y; break; } }

  const nb = (cx, cy, rx, ry) => {
    for (let y = Math.max(0, cy - ry - 3); y < H; y++) for (let x = Math.max(0, cx - rx - 3); x < Math.min(W, cx + rx + 3); x++) {

  for (const j of jellies) {
    j.tt -= dt;
    if (j.tt <= 0) { j.ty = rnd(30, 125); j.tt = rnd(8, 20); }
    const up = j.y > j.ty;
    j.ph += dt * j.sp * (up ? 1.3 : 0.7);
    const c = Math.max(0, Math.sin(j.ph));
    j.vy += ((up ? 2.5 : 4) - c * c * (up ? 24 : 4)) * dt; j.vy *= 1 - dt * 1.2;
    j.vx += (Math.sin(T * 0.1 + j.x * 0.01) * 3 + cur * 2 - j.vx) * dt * 0.3;
    j.x += j.vx * dt; j.y += j.vy * dt;
    if (j.y < SURF + 10) j.vy += 12 * dt;
    if (j.x < -12) j.x = W + 10; else if (j.x > W + 12) j.x = -10;
    const k = Math.min(1, dt * 7);
    j.tent.forEach((pts, ti) => {
      pts[0].x = j.x + (ti - 1.5) * j.sz * 0.5; pts[0].y = j.y + 1;
      for (let n = 1; n < pts.length; n++) {
        const p = pts[n], q = pts[n - 1];
        p.x += (q.x + Math.sin(T * 1.5 + n * 0.4 + ti + j.ph) * 0.35 - p.x) * k;

function drawJellies() {
  const L = LUT[2];

    const x0 = R(j.x), y0 = R(j.y), g = N;

      const rr = 8;
      for (let dy = -rr; dy <= rr; dy++) for (let dx = -rr; dx <= rr; dx++) {
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d < rr) { const a = (1 - d / rr) ** 2 * g * 0.35 * (0.8 + 0.2 * c); ADD(x0 + dx, y0 - 1 + dy, gcol[0] * a, gcol[1] * a, gcol[2] * a); }
      }
    }
    const body = j.hue ? EM[JELY] : EM[GLOW];
    for (const pts of j.tent) for (let n = 1; n < pts.length; n++) {
      const px = R(pts[n].x), py = R(pts[n].y);
      if (g > bay(px, py)) { PA(px, py, body, 0.8); }
      else PA(px, py, L[JELY], 0.45);
    }
    const hh = Math.ceil(h), ww = Math.ceil(w);
    for (let dy = -hh; dy <= 0; dy++) for (let dx = -ww; dx <= ww; dx++) {
      const ex = dx / w, ey = dy / h;
      if (ex * ex + ey * ey >= 1) continue;
      const px = x0 + dx, py = y0 + dy, rim = dy === 0, inner = Math.abs(dx) < w * 0.45 && dy > -h * 0.65 && dy < -1;
      if (g > bay(px, py)) PA(px, py, rim ? EM[WHT] : inner ? EM[j.hue ? PINK : AQUA] : body, 0.85);

}

// ---------- plants ----------
const kelps = [[70, 34], [76, 26], [118, 22], [163, 30], [169, 40], [232, 28], [314, 36], [22, 18], [290, 16], [190, 20]]
  .map(([x, n]) => ({ x, y: groundTop[x], n, ph: rnd(6), push: 0 }));
function updKelp(dt) {
  for (const k of kelps) {
    let tgt = 0;
    for (const t of threats) {
      if (t.lv < 0.35) continue;
      const dx = k.x - t.x;
      if (Math.abs(dx) < 20 && t.y > k.y - k.n - 6 && t.y < k.y + 4) tgt += Math.sign(dx || 1) * (20 - Math.abs(dx)) * 0.35;
    }
    k.push += (tgt - k.push) * Math.min(1, dt * 2);
  }
}
function drawKelp() {
  const L = LUT[2];
  for (const k of kelps) for (let s = 0; s <= k.n; s++) {
    const t = s / k.n;
    const off = Math.sin(T * 0.9 + k.ph - s * 0.11) * 3.2 * t * t + cur * 4 * t * t + k.push * t * t;
    const px = R(k.x + off), py = k.y - s;
    P(px, py, L[GRN1]);
    if (s % 3 === 0 && s > 2) { const sd = (s / 3) & 1 ? 1 : -1; P(px + sd, py, L[GRN0]); if (s % 6 === 0) P(px + sd * 2, py - 1, L[GRN0]); }
  }
}
const grass = [];
for (let i = 0; i < 16; i++) grass.push({ x: rnd(0, 26), h: rnd(12, 30), ph: rnd(6), w: Math.random() < 0.5 ? 2 : 1 });
for (let i = 0; i < 14; i++) grass.push({ x: rnd(296, 320), h: rnd(10, 26), ph: rnd(6), w: Math.random() < 0.5 ? 2 : 1 });
for (let i = 0; i < 5; i++) grass.push({ x: rnd(150, 162), h: rnd(6, 11), ph: rnd(6), w: 1 });
function drawGrass() {
  const L = LUT[3];
  for (const g of grass) for (let s = 0; s < g.h; s++) {
    const t = s / g.h, off = Math.sin(T * 1.1 + g.ph - s * 0.1) * 4 * t * t + cur * 3 * t;
    const px = R(g.x + off), py = H - 1 - s, c = L[s > g.h - 3 ? GRN0 : GRN1];
    P(px, py, c);
    if (g.w > 1 && t < 0.6) P(px + 1, py, c);
  }
}

// ---------- ambient particles ----------
const plank = [...Array(160)].map(() => ({ x: rnd(W), y: rnd(20, 150), ph: rnd(6), g: 0 }));
const snow = [...Array(70)].map(() => ({ x: rnd(W), y: rnd(15, 150), v: rnd(1.5, 3.2), ph: rnd(6), far: Math.random() < 0.5 }));
const stars = [...Array(26)].map(() => ({ x: R(rnd(W)), y: R(rnd(0, 8)), p: rnd(6) }));
const clouds = [...Array(3)].map((_, i) => ({ x: rnd(W), y: 2 + i * 2, w: R(rnd(10, 22)), v: rnd(1.5, 3) }));
const vents = [{ x: 42 }, { x: 290 }, { x: 146 }, { x: 214 }].map(v => ({ x: v.x, y: gT(v.x), t: rnd(2), n: 0 }));
function updAmbient(dt) {
  for (const p of plank) {
    p.x += (cur * 1.5 + Math.sin(T * 0.3 + p.ph) * 1.2) * dt;
    p.y += Math.sin(T * 0.25 + p.ph * 1.7) * 0.8 * dt;
    if (p.x < 0) p.x += W; else if (p.x >= W) p.x -= W;
    p.g = Math.max(p.g * Math.exp(-dt * 1.5), Math.min(1.2, gridAt(p.x, p.y)));
    if (Math.random() < dt * 0.02) p.g = 1;
  }
  for (const s of snow) {
    s.y += s.v * dt; s.x += (cur * 2 + Math.sin(T * 0.7 + s.ph) * 0.8) * dt;
    if (s.y > 150) { s.y = SURF + 2; s.x = rnd(W); }
    if (s.x < 0) s.x += W; else if (s.x >= W) s.x -= W;
  }
  for (const c of clouds) { c.x += c.v * dt; if (c.x > W + 5) { c.x = -c.w - 5; c.w = R(rnd(10, 22)); } }
  for (const v of vents) {
    v.t -= dt;
    if (v.t <= 0) {
      if (v.n > 0) { v.n--; v.t = rnd(0.06, 0.2); bub(v.x + rnd(-1, 1), v.y - 1, Math.random() < 0.3 ? 1 : 0); }
      else { v.n = R(rnd(2, 7)); v.t = rnd(1.5, 5); }
    }
  }
  if (Math.random() < dt * 0.4) bub(rnd(8, 30), H - 4, 2, true);
  if (Math.random() < dt * 0.3) bub(rnd(292, 314), H - 4, 2, true);
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.y -= b.vy * dt; b.x += (Math.sin(T * 4 + b.ph) * 6 + cur * 2) * dt;
    const sy = surf[clamp(R(b.x), 0, W - 1)];
    if (b.y <= sy + 1) {
      for (let k = 0; k < 2; k++) part({ x: b.x, y: sy, vx: rnd(-8, 8), vy: rnd(-14, -8), g: 40, dr: 0, l: 0.35, m: 0.35, c: WHT, L: 4, sz: 1 });
      bubbles[i] = bubbles[bubbles.length - 1]; bubbles.pop();
    } else stir(b.x, b.y, 0.02);
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.vx *= 1 - p.dr * dt; p.vy *= 1 - p.dr * dt; p.vy += p.g * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.l -= dt;
    if (p.c !== WHT && p.c !== INK) { const gy = gT(p.x); if (p.y > gy - 1 && p.vy > 0) { p.y = gy - 1; p.vy = 0; p.vx *= 0.5; } }
    if (p.l <= 0) { parts[i] = parts[parts.length - 1]; parts.pop(); }
  }
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].a += dt; if (ripples[i].a > 3) ripples.splice(i, 1); }
}

// ---------- update ----------
function update(dt) {
  T += dt;
  computeLight();
  cur = Math.sin(T * 0.12) * 0.6 + Math.sin(T * 0.037) * 0.4;
  for (let x = 0; x < W; x++) {
    let o = Math.sin(x * 0.09 + T * 1.3) * 1.1 + Math.sin(x * 0.21 - T * 1.9) * 0.6;
    for (const r of ripples) {
      const d = Math.abs(x - r.x);
      if (d < 45 && d < r.a * 22) o += Math.sin(d * 0.8 - r.a * 8) * 1.6 * Math.exp(-r.a * 0.9) * (1 - d / 45);
    }
    surf[x] = R(SURF + o);
  }
  threats.length = 0;
  const dk = Math.exp(-dt * 2.5);
  for (let i = 0; i < grid.length; i++) grid[i] *= dk;
  for (const s of sharks) s.update(dt);
  updMoray(dt); updOcto(dt); updSting(dt); updEagle(dt); updTurtle(dt); updManta(dt);
  for (const s of schools) s.update(dt);
  updClowns(dt); updCrabs(dt); updShrimp(dt); updEels(dt); updJellies(dt); updKelp(dt); updAmbient(dt);
}

// ---------- render ----------
const rayT = new Float32Array(W + H), vrow = new Float32Array(H), rayFade = new Float32Array(H);
for (let y = 0; y < H; y++) { vrow[y] = 0.7 + clamp((y - SURF) / 150, 0, 1) * 2.5; rayFade[y] = clamp(1 - (y - SURF) / 140, 0, 1); }
function renderBG() {
  const L0 = LUT[0], L1 = LUT[1], L4 = LUT[4];
  const WC = [L4[1], L4[2], L4[3], L4[4], L4[5]];
  const rs = Math.max(D, N * 0.3);
  for (let u = 0; u < rayT.length; u++) {
    const r = Math.sin(u * 0.055 + T * 0.22) + 0.8 * Math.sin(u * 0.021 - T * 0.11 + 1.7) + 0.4 * Math.sin(u * 0.13 + T * 0.5);
    rayT[u] = Math.max(0, r - 1.0) * 0.9 * rs;
  }
  for (let y = 0; y < H; y++) {
    const vr = vrow[y], rf = rayFade[y], yb = (y & 3) << 2, row = y * W, yh = y >> 1, st = y / SURF;
    for (let x = 0; x < W; x++) {
      const i = row + x, sy = surf[x];
      let c;
      if (y < sy) c = st > BAY[yb | (x & 3)] ? SKYB : SKYT;
      else if (y === sy) c = SURFC;
      else if (far1[i] !== 255) c = L1[far1[i]];
      else if (far2[i] !== 255) c = L0[far2[i]];
      else {
        let v = vr - rayT[x + yh] * rf;
        if (y === sy + 1) v -= 0.8;
        if (v < 0) v = 0;
        let k = v | 0;
        if ((v - k - 0.3) * 2.5 > BAY[yb | (x & 3)]) k++;
        c = WC[k > 4 ? 4 : k];
      }
      buf[i] = c;
    }
  }
}
function skyPix(x, y, c) { if (x >= 0 && x < W && y >= 0 && y < surf[x]) buf[y * W + x] = c; }
function drawSky() {
  if (N > 0.2) for (const s of stars) { if (N * (0.55 + 0.45 * Math.sin(T * 2 + s.p)) > bay(s.x, s.y) + 0.2) skyPix(s.x, s.y, EM[WHT]); }
  if (phase < 0.56) {
    const t = phase / 0.56, sx = R(-8 + t * (W + 16)), sy = R(10 - Math.sin(t * PI) * 7);
    for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++) if (dx * dx + dy * dy <= 9) skyPix(sx + dx, sy + dy, WARM > bay(sx + dx, sy + dy) ? EM[ORNG] : EM[YEL]);
  } else if (phase > 0.58 && phase < 0.98) {
    const t = (phase - 0.58) / 0.4, sx = R(-6 + t * (W + 12)), sy = R(9 - Math.sin(t * PI) * 6);
    for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) if (dx * dx + dy * dy <= 5) skyPix(sx + dx, sy + dy, dx === 1 && dy === 0 ? EM[ROCK0] : EM[SILV]);
  }
  const cc = LUT[4][WHT], cs = LUT[4][SKY0];
  for (const c of clouds) {
    const x0 = R(c.x);
    for (let x = x0; x < x0 + c.w; x++) { skyPix(x, c.y + 1, cs); if (x > x0 + 2 && x < x0 + c.w - 3) skyPix(x, c.y, cc); }
  }
  for (let x = 0; x < W; x++) {
    if (D > 0.2 && Math.sin(x * 0.5 + T * 3) + Math.sin(x * 0.23 - T * 2) > 1.4) P(x, surf[x] + 1, LUT[4][WHT]);
  }
}
function drawFar() {
  const L1 = LUT[1], c1 = L1[SILV], c2 = L1[SHK0];
  for (let i = 0; i < 34; i++) {
    const t = T - i * 0.09;
    const x = R(W / 2 + Math.sin(t * 0.13) * W * 0.55 + Math.sin(t * 0.31) * 30 + Math.sin(T * 1.3 + i * 2.1) * 3);
    const y = R(88 + Math.sin(t * 0.21) * 10 + Math.sin(t * 0.53) * 5 + Math.cos(T * 1.1 + i * 1.7) * 2);
    P(x, y, c1); P(x + 1, y, c2);
  }
  if (manta.st !== 'off') drawRay(manta, 2.3, 0.8, LUT[0], INK, ROCK2, -1, 6);
  for (const s of snow) if (s.far) PA(R(s.x), R(s.y), L1[SILV], 0.6);
}
function renderMid() {
  const L = LUT[2], caust = D > 0.05;
  const T12 = T * 1.2, T08 = T * 0.8, T09 = T * 0.9, T06 = T * 0.6;
  for (let n = 0; n < midI.length; n++) {
    let c = midC[n];
    const w = midW[n];
    if (caust && w > 0) {
      const x = midX[n], y = midY[n];
      const a = Math.sin(x * 0.21 + T12 + Math.sin(y * 0.35 + T08) * 1.5);
      const b = Math.sin(x * 0.15 - y * 0.3 - T09 + Math.sin(x * 0.09 - T06) * 1.3);
      const s = (0.45 - Math.abs(a + b)) / 0.45 * D * w;
      if (s > BAY[((y & 3) << 2) | (x & 3)]) c = LIGHT[c];
    }
    buf[midI[n]] = L[c];
  }
}
function drawEffects() {
  const L2 = LUT[2], L3 = LUT[3];
  for (const b of bubbles) {
    const L = b.near ? L3 : L2, x = R(b.x), y = R(b.y), cw = L[WHT], cs = L[SKY0];
    if (b.r === 0) PA(x, y, cw, 0.8);
    else if (b.r === 1) { P(x, y - 1, cw); P(x - 1, y, cs); P(x + 1, y, cs); P(x, y + 1, cs); }
    else {
      const ring = [[-1, -2], [0, -2], [1, -2], [-2, -1], [2, -1], [-2, 0], [2, 0], [-2, 1], [2, 1], [-1, 2], [0, 2], [1, 2]];
      for (const [dx, dy] of ring) PA(x + dx, y + dy, cs, 0.85);
      P(x - 1, y - 1, cw);
    }
  }
  for (const p of parts) {
    const a = p.l / p.m, x = R(p.x), y = R(p.y), c = LUT[p.L][p.c];
    if (p.sz > 1) { const sz = p.c === INK ? 2 + R((1 - a) * 2) : 2; for (let dy = 0; dy < sz; dy++) for (let dx = 0; dx < sz; dx++) PA(x + dx - (sz >> 1), y + dy - (sz >> 1), c, a * 0.9); }
    else PA(x, y, c, a);
  }
  if (N > 0.05) for (const p of plank) {
    const b = N * (0.1 + 0.2 * (0.5 + 0.5 * Math.sin(T * 1.7 + p.ph * 3)) + p.g * 1.3);
    if (b < 0.1) continue;
    const x = R(p.x), y = R(p.y);
    if (y <= surf[clamp(x, 0, W - 1)]) continue;
    const bb = Math.min(1, b);
    ADD(x, y, 70 * bb, 255 * bb, 210 * bb);
    if (b > 0.5) { const h = 0.35 * bb; ADD(x - 1, y, 30 * h, 110 * h, 90 * h); ADD(x + 1, y, 30 * h, 110 * h, 90 * h); ADD(x, y - 1, 30 * h, 110 * h, 90 * h); ADD(x, y + 1, 30 * h, 110 * h, 90 * h); }
  }
  for (const s of snow) if (!s.far) PA(R(s.x), R(s.y), L2[SILV], 0.45 + D * 0.3);
}
function renderNear() {
  const L = LUT[3];
  for (let n = 0; n < nearI.length; n++) buf[nearI[n]] = L[nearMap[nearI[n]]];
}
function render() {
  renderBG(); drawSky(); drawFar(); renderMid();
  drawKelp(); drawEels(); drawMoray(); drawOcto(); drawCrabs(); drawShrimp(); drawSting();
  for (const s of schools) s.draw();
  drawTurtle(); drawEagle();
  for (const s of sharks) s.draw();
  drawClowns(); drawAnemone(); drawJellies(); drawEffects();
  renderNear(); drawGrass();
  ctx.putImageData(img, 0, 0);
}

// ---------- loop & debug ----------
const dbg = document.getElementById('dbg');
let showDbg = false, fpsN = 0, fpsT = 0, fps = 0, last = performance.now();
addEventListener('keydown', e => { if (e.key === 'd' || e.key === 'D') { showDbg = !showDbg; dbg.style.display = showDbg ? 'block' : 'none'; } });
function debugText() {
  const fish = schools.reduce((a, s) => a + s.vis, 0);
  const clock = ['朝', '昼', '昼', '昼', '夕', '夜', '夜', '夜', '夜', '朝'][Math.min(9, (phase * 10) | 0)];
  return `FPS ${fps}\n時刻 ${clock} (${(phase * 100).toFixed(0)}%)  明るさ ${D.toFixed(2)}\n` +
    `魚 ${fish}  サメ ${sharks.filter(s => s.wait <= 0).length}  クマノミ ${clowns.length}\n` +
    `クラゲ ${jellies.length}  カニ ${crabs.length}  エビ ${shrimps.length}  チンアナゴ ${eels.length}\n` +
    `ウミガメ ${turtle.st}  タコ ${octo.st} 擬態${octo.camo.toFixed(2)}\n` +
    `エイ ${sting.st}  マダラトビエイ ${eagle.st}  マンタ ${manta.st}\n` +
    `泡 ${bubbles.length}  粒子 ${parts.length}  プランクトン ${plank.length}\n` +
    `サメ状態 ${sharks.map(s => s.wait > 0 ? 'away' : s.st).join(' / ')}`;
}
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05;
  if (dt > 0) update(dt);
  render();
  fpsN++; fpsT += dt;
  if (fpsT >= 0.5) { fps = Math.round(fpsN / fpsT); fpsN = 0; fpsT = 0; if (showDbg) dbg.textContent = debugText(); }
  requestAnimationFrame(frame);
}
for (let i = 0; i < 180; i++) update(1 / 60);
T = 0;
render();
requestAnimationFrame(frame);
})();
</script>
<script>
(() => {
  const gear = document.getElementById('gear'), opt = document.getElementById('opt');
  let hideT = 0;
  const poke = () => {
    document.body.classList.add('ui-on');
    clearTimeout(hideT);
    hideT = setTimeout(() => { if (opt.hidden) document.body.classList.remove('ui-on'); }, 2500);
  };
  const close = () => { opt.hidden = true; poke(); };
  addEventListener('pointermove', poke);
  addEventListener('pointerdown', poke);
  gear.addEventListener('click', () => { opt.hidden = false; document.body.classList.add('ui-on'); });
  document.getElementById('optClose').addEventListener('click', close);
  opt.addEventListener('click', e => { if (e.target === opt) close(); });
  addEventListener('keydown', e => { if (e.key === 'Escape' && !opt.hidden) close(); });
})();
</script>
